<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar reservas · NanoCalendar</title><style>:root{--bg:#edf0f5;--card:#fff;--ink:#0f1726;--muted:#586377;--line:#d3dae5;--accent:#2346e6;--ok:#1b7f4f;--bad:#c1243f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:24px 16px 50px}h1{font-size:36px;line-height:1;margin:0}.sub{color:var(--muted);margin:8px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}h2{font-size:20px;margin:0 0 12px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.slotrow{display:grid;grid-template-columns:1fr auto;gap:8px}.slotrow input,input[type=email],input[type=password]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}.btn{min-height:46px;padding:0 15px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#e2e7ef;color:var(--ink)}.btn.bad{background:#f9d9de;color:#97203a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1}.note{font-size:13px;color:var(--muted)}.msg{padding:11px 13px;border-radius:11px;margin-top:12px;background:#dae2ff}.ok{background:#dff2e8;color:#145f3a}.err{background:#f9d9de;color:#97203a}.reservation{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.reservation:last-child{border-bottom:0}.time{font-size:20px;font-weight:800}.name{font-weight:700}.meta{font-size:12px;color:var(--muted)}.count{font-size:12px;color:var(--muted)}.hidden{display:none!important}@media(max-width:520px){.reservation{grid-template-columns:65px 1fr}.reservation .actions{grid-column:1/-1}.slots{grid-template-columns:1fr}.slotrow{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>Reservas</h1><p class="sub">Configurá los horarios y pasá las reservas a tu NanoCalendar.</p><section id="login" class="card"><h2>Acceso</h2><input id="email" type="email" placeholder="Correo" autocomplete="username"><br><br><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password"><div class="actions"><button class="btn" id="loginBtn">Ingresar</button></div><div id="loginMsg" class="msg hidden"></div></section><section id="app" class="hidden"><section class="card"><h2>Horarios de los sábados</h2><p class="note">Podés poner uno o varios horarios. Las personas pueden reservarse en el mismo horario.</p><div id="slotEditor" class="slots"></div><div class="actions"><button class="btn alt" id="addSlot">Agregar horario</button><button class="btn" id="saveSlots">Guardar horarios</button></div><div id="saveMsg" class="msg hidden"></div></section><section class="card"><h2>Reservas</h2><div id="summary" class="note">Cargando…</div><div id="list"></div></section></section></main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>
const cfg={apiKey:'AIzaSyA6uZNys0TFHduq90JSeRB9cOzJjBkpKTs',authDomain:'nanocalendar17.firebaseapp.com',projectId:'nanocalendar17',storageBucket:'nanocalendar17.firebasestorage.app',messagingSenderId:'1054350803625',appId:'1:1054350803625:web:8b6a226d02c15620255fb8'};firebase.initializeApp(cfg);const db=firebase.firestore(),auth=firebase.auth();const $=id=>document.getElementById(id);let slots=['10:00','11:00'],reservations=[];
function msg(id,text,kind=''){const e=$(id);e.textContent=text;e.className='msg '+kind;e.classList.remove('hidden')}
function renderSlots(){$('slotEditor').innerHTML=slots.map((s,i)=>`<div class="slotrow"><input type="time" value="${s}" data-i="${i}"><button class="btn bad" data-del="${i}">Quitar</button></div>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{slots.splice(Number(b.dataset.del),1);renderSlots()})}
async function load(){try{const c=await db.collection('publicConfig').doc('reservas').get();if(c.exists&&Array.isArray(c.data().slots)&&c.data().slots.length)slots=c.data().slots.map(String)}catch(e){}renderSlots();const q=await db.collection('publicReservations').orderBy('date').orderBy('time').get();reservations=q.docs.map(d=>({id:d.id,...d.data()}));renderReservations()}
function renderReservations(){const counts={};reservations.forEach(r=>{const k=r.date+'|'+r.time;counts[k]=(counts[k]||0)+1});$('summary').textContent=reservations.length+' reservas registradas';$('list').innerHTML=reservations.length?reservations.map(r=>`<div class="reservation"><div class="time">${r.time}</div><div><div class="name">${esc(r.name)}</div><div class="meta">${r.date}${r.phone?' · '+esc(r.phone):''}</div></div><div class="count">${counts[r.date+'|'+r.time]} en horario</div></div>`).join(''):'<p class="note">Todavía no hay reservas.</p>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginBtn').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){msg('loginMsg','Correo o contraseña incorrectos.','err')}};
$('addSlot').onclick=()=>{slots.push('12:00');renderSlots()};$('saveSlots').onclick=async()=>{const vals=[...document.querySelectorAll('#slotEditor input')].map(x=>x.value).filter(Boolean).sort();if(!vals.length){msg('saveMsg','Dejá al menos un horario.','err');return}slots=vals;try{await db.collection('publicConfig').doc('reservas').set({slots,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});msg('saveMsg','Horarios guardados.','ok')}catch(e){msg('saveMsg','No se pudieron guardar. Revisá las reglas de Firebase.','err')}};
</script></body></html>
