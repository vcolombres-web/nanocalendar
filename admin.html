<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de reservas · NanoReservas</title><style>:root{--bg:#edf0f5;--card:#fff;--ink:#0f1726;--muted:#586377;--line:#d3dae5;--accent:#2346e6;--ok:#1b7f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.back{color:var(--ink);text-decoration:none;font-weight:600}h1{font-size:38px;margin:0}.sub{color:var(--muted);margin:8px 0 24px}.card{background:var(--card);border-radius:18px;padding:20px;margin:14px 0}.hidden{display:none!important}.btn{min-height:46px;padding:0 16px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#e2e7ef;color:var(--ink)}.actions,.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{flex:1;min-width:220px;font-weight:700}.controls input{display:block;width:100%;margin-top:7px;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px}h2{margin:0 0 14px}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.month-title{font-size:24px;font-weight:800;text-transform:capitalize}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{text-align:center;color:var(--muted);font-weight:700;font-size:13px;padding:6px}.day{min-height:82px;border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff;cursor:pointer;position:relative}.day:hover{border-color:#8fa0d5}.day.other{opacity:.35}.day.today{outline:2px solid #2346e6}.day.has{background:#f0f4ff;border-color:#9aace6}.day-number{font-weight:800}.day-count{margin-top:8px;font-size:13px;font-weight:800;color:#2447a7}.day-slots{font-size:11px;color:var(--muted);margin-top:3px}.selected-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.slotgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.slotcard{background:#f3f4f6;border-radius:14px;padding:18px}.slotcard .time{font-size:20px;font-weight:800}.slotcard .big{font-size:30px;font-weight:800;margin-top:8px}.reservation{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.reservation:last-child{border-bottom:0}.time{font-size:20px;font-weight:800}.name{font-weight:700}.meta{font-size:13px;color:var(--muted)}.count{font-size:13px;color:var(--muted)}.badge{display:inline-block;background:#e8efff;color:#2447a7;border-radius:999px;padding:6px 10px;font-weight:800}.empty{color:var(--muted);padding:8px 0}.next-list{display:grid;gap:9px}.next-row{display:grid;grid-template-columns:190px 1fr auto;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.next-row:hover{border-color:#9aa9d8}.next-date{font-weight:800}.next-detail{color:var(--muted);font-size:14px}@media(max-width:650px){.wrap{padding:20px 12px 40px}h1{font-size:31px}.top{align-items:flex-start}.calendar{gap:4px}.weekdays{gap:4px}.day{min-height:64px;padding:6px;border-radius:9px}.day-count{font-size:11px}.day-slots{display:none}.slotgrid{grid-template-columns:1fr}.reservation{grid-template-columns:65px 1fr}.reservation .count{display:none}.next-row{grid-template-columns:1fr auto;gap:5px 10px}.next-detail{grid-column:1}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Panel de reservas</h1><p class="sub">Administración del gimnasio</p></div><a class="back" href="/">← Volver a reservas</a></div><section id="login" class="card"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo" autocomplete="username" style="width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px"><br><br><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px"><div class="actions"><button class="btn" id="loginBtn">Ingresar</button></div></section><section id="app" class="hidden"><section class="card"><h2>📅 Calendario de reservas</h2><div class="calendar-head"><button class="btn alt" id="prev">←</button><div class="month-title" id="monthTitle"></div><button class="btn alt" id="next">→</button></div><div class="weekdays"><div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mié</div><div class="weekday">Jue</div><div class="weekday">Vie</div><div class="weekday">Sáb</div><div class="weekday">Dom</div></div><div id="calendar" class="calendar"></div></section><section class="card"><h2>📌 Próximas reservas</h2><div id="nextList" class="next-list"></div></section><section class="card"><div class="controls"><label>Consultar fecha<input id="date" type="date"></label><button class="btn" id="refresh">Actualizar</button><button class="btn alt" id="today">Hoy</button><button class="btn alt" id="logout">Salir</button></div></section><section id="selected" class="card hidden"></section></section></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>const cfg={apiKey:'AIzaSyA6uZNys0TFHduq90JSeRB9cOzJjBkpKTs',authDomain:'nanocalendar17.firebaseapp.com',projectId:'nanocalendar17',storageBucket:'nanocalendar17.firebasestorage.app',messagingSenderId:'1054350803625',appId:'1:1054350803625:web:8b6a226d02c15620255fb8'};firebase.initializeApp(cfg);const db=firebase.firestore(),auth=firebase.auth(),$=id=>document.getElementById(id);let slots=['09:00','10:30'],reservations=[],view=new Date();view.setDate(1);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function active(){return reservations.filter(r=>String(r.status||'').toLowerCase()!=='cancelado')}function keyDate(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function fmtDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),a=active();$('monthTitle').textContent=new Date(y,m,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});const first=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate();let html='';for(let i=0;i<first;i++){const d=prevLast-first+i+1;html+=`<div class="day other"><div class="day-number">${d}</div></div>`}for(let d=1;d<=last;d++){const date=keyDate(y,m,d),rs=a.filter(r=>r.date===date),by={};rs.forEach(r=>by[r.time]=(by[r.time]||0)+1);const today=new Date();const isToday=date===keyDate(today.getFullYear(),today.getMonth(),today.getDate());html+=`<div class="day ${rs.length?'has ':''}${isToday?'today':''}" data-date="${date}"><div class="day-number">${d}</div>${rs.length?`<div class="day-count">👥 ${rs.length} ${rs.length===1?'reserva':'reservas'}</div><div class="day-slots">${slots.map((s,i)=>`T${i+1}: ${by[s]||0}`).join(' · ')}</div>`:''}</div>`}const total=Math.ceil((first+last)/7)*7;for(let i=last+first;i<total;i++)html+=`<div class="day other"><div class="day-number">${i-(last+first)+1}</div></div>`;$('calendar').innerHTML=html;document.querySelectorAll('.day[data-date]').forEach(e=>e.onclick=()=>selectDate(e.dataset.date))}function renderNext(){const a=active(),today=new Date();today.setHours(0,0,0,0);const dates=[...new Set(a.map(r=>r.date))].filter(s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)>=today}).sort().slice(0,20);$('nextList').innerHTML=dates.length?dates.map(date=>{const rs=a.filter(r=>r.date===date);const by={};rs.forEach(r=>by[r.time]=(by[r.time]||0)+1);return `<div class="next-row" data-date="${date}"><div class="next-date">${fmtDate(date)}</div><div class="next-detail">${slots.map((s,i)=>`Turno ${i+1} ${s}: ${by[s]||0}`).join(' · ')}</div><div class="badge">${rs.length} ${rs.length===1?'reserva':'reservas'}</div></div>`}).join(''):'<div class="empty">No hay reservas futuras.</div>';document.querySelectorAll('.next-row').forEach(e=>e.onclick=()=>selectDate(e.dataset.date))}function selectDate(date){$('date').value=date;renderSelected();$('selected').scrollIntoView({behavior:'smooth',block:'start'})}function renderSelected(){const date=$('date').value;if(!date){$('selected').classList.add('hidden');return}const a=active().filter(r=>r.date===date),counts={};a.forEach(r=>counts[r.time]=(counts[r.time]||0)+1);$('selected').classList.remove('hidden');$('selected').innerHTML=`<div class="selected-title"><h2>${fmtDate(date)}</h2><span class="badge">${a.length} ${a.length===1?'reserva':'reservas'}</span></div><div class="slotgrid">${slots.map((s,i)=>`<div class="slotcard"><div>Turno ${i+1}</div><div class="time">${s}</div><div class="big">${counts[s]||0}<small> / 50</small></div><div>${counts[s]?'👥 Hay reservas':'Sin reservas'}</div></div>`).join('')}</div><div style="margin-top:18px"><h2 style="font-size:20px">👥 Quiénes reservaron</h2>${a.length?a.sort((x,y)=>(x.time||'').localeCompare(y.time||'')).map(r=>`<div class="reservation"><div class="time">${esc(r.time)}</div><div><div class="name">${esc(r.name)}</div><div class="meta">${r.phone?'📱 '+esc(r.phone):''}</div></div><div class="count">Confirmada</div></div>`).join(''):'<div class="empty">No hay reservas para este día.</div>'}</div>`}async function load(){try{const c=await db.collection('publicConfig').doc('reservas').get();if(c.exists&&Array.isArray(c.data().slots)&&c.data().slots.length)slots=c.data().slots.map(String)}catch(e){console.error(e)}try{const q=await db.collection('publicReservations').get();reservations=q.docs.map(d=>({id:d.id,...d.data()}));renderCalendar();renderNext();if(!$('date').value){const t=new Date();$('date').value=keyDate(t.getFullYear(),t.getMonth(),t.getDate())}renderSelected()}catch(e){console.error(e);$('calendar').innerHTML='<div class="empty">No se pudieron cargar las reservas.</div>'}}$('loginBtn').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){alert('Correo o contraseña incorrectos.')}};$('refresh').onclick=load;$('today').onclick=()=>{const t=new Date();view=new Date(t.getFullYear(),t.getMonth(),1);$('date').value=keyDate(t.getFullYear(),t.getMonth(),t.getDate());renderCalendar();renderSelected()};$('date').onchange=()=>{const [y,m]=String($('date').value).split('-').map(Number);view=new Date(y,m-1,1);renderCalendar();renderSelected()};$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};$('logout').onclick=()=>auth.signOut().then(()=>location.reload());</script></body></html>
