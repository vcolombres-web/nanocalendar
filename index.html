var KEYU=KEY;
function loadLocal(){try{var j=localStorage.getItem(KEYU);if(!j)return null;var x=JSON.parse(j),b=base();x.pagos=Array.isArray(x.pagos)?x.pagos:[];x.packs=Array.isArray(x.packs)&&x.packs.length?x.packs:b.packs;return x}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEYU,JSON.stringify(S))}catch(e){}}
var saved={estado:'',m:{}},saving=false,again=false,tmr=null,col=null,pending=false;
function estadoDoc(){return {v:2,demo:S.demo,servicios:S.servicios,clientes:S.clientes,pagos:S.pagos||[],packs:S.packs||[],aj:S.aj}}
function persist(){saveLocal();if(!dbo)return;pending=true;clearTimeout(tmr);tmr=setTimeout(flush,350)}
async function flush(){
  if(!dbo||!col)return;
  if(saving){again=true;return}
  saving=true;
  try{
    do{
      again=false;
      var es=JSON.stringify(estadoDoc());
      if(es!==saved.estado){saved.estado=es;await col.doc('estado').set(JSON.parse(es))}
      var g={};S.turnos.forEach(function(t){var k=t.fecha.slice(0,7);(g[k]=g[k]||[]).push(t)});
      for(var k in g){var js=JSON.stringify(g[k]);if(saved.m[k]!==js){saved.m[k]=js;await col.doc('t-'+k).set({t:JSON.parse(js)})}}
      for(var k2 in saved.m){if(!g[k2]){delete saved.m[k2];await col.doc('t-'+k2).delete()}}
    }while(again);
  }catch(e){toast('No se pudo guardar en la nube. Queda guardado en este teléfono.')}
  saving=false;pending=false;
}
function commit(){persist();render()}

function applyEstado(d){
  var b=base();
  S.demo=!!d.demo;
  S.servicios=Array.isArray(d.servicios)&&d.servicios.length?d.servicios:b.servicios;
  S.clientes=Array.isArray(d.clientes)?d.clientes:[];
  S.pagos=Array.isArray(d.pagos)?d.pagos:[];
  S.packs=Array.isArray(d.packs)&&d.packs.length?d.packs:b.packs;
  S.aj=Object.assign(b.aj,d.aj||{});
}
function flat(m){var out=[];for(var k in m){try{out=out.concat(JSON.parse(m[k]))}catch(e){}}return out}
function sameM(a,b){var ka=Object.keys(a),kb=Object.keys(b);if(ka.length!==kb.length)return false;return ka.every(function(k){return a[k]===b[k]})}

function attach(db,id){
  dbo=db;col=db.collection('data/users/'+id);
  col.onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.fromCache&&!booted)return;
    var m={},est=null,n=0;
    snap.docs.forEach(function(d){
      var x=d.data();n++;
      if(d.id==='estado')est=clone(x);
      else if(d.id.indexOf('t-')===0)m[d.id.slice(2)]=JSON.stringify((x&&x.t)||[]);
    });
    if(!booted){
      booted=true;
      if(!n){var loc=loadLocal();S=loc||mkDemo();persist()}
      else{if(est){saved.estado=JSON.stringify(est);applyEstado(est)}saved.m=m;S.turnos=flat(m)}
      render();return;
    }
    if(pending||saving)return;
    var changed=false;
    if(est){var js=JSON.stringify(est);if(js!==saved.estado){saved.estado=js;applyEstado(est);changed=true}}
    if(!sameM(m,saved.m)){saved.m=m;S.turnos=flat(m);changed=true}
    if(changed)render();
  },function(){fallback()});
  setTimeout(function(){if(!booted){dbo=null;fallback();toast('Sin conexión con la nube. Se usa lo guardado en este teléfono.')}},7000);
}
function fallback(){
  if(booted)return;
  booted=true;dbo=null;
  var loc=loadLocal();S=loc||mkDemo();render();
}
function offline(){booted=true;var loc=loadLocal();S=loc||mkDemo();render()}
function start(){
  var ok=window.claude&&window.claude.use;
  var dbP=ok?window.claude.use('db'):Promise.resolve(null);
  var usP=ok?window.claude.use('user'):Promise.resolve(null);
  Promise.all([dbP,usP]).then(function(r){
    if(!r[0]||!r[1])return null;
    return r[1].id().then(function(id){return id?{db:r[0],id:id}:null});
  }).then(function(x){
    if(x){KEYU=KEY+':'+x.id;attach(x.db,x.id)}else offline();
  }).catch(offline);
}

var cli=function(id){return S.clientes.find(function(c){return c.id===id})};
var serv=function(id){return S.servicios.find(function(s){return s.id===id})||{id:'',nombre:'Servicio eliminado',min:60,c:0}};
var cmpT=function(a,b){return a.fecha.localeCompare(b.fecha)||a.hora.localeCompare(b.hora)};
var activos=function(f){return S.turnos.filter(function(t){return t.fecha===f&&t.estado!=='cancelado'}).sort(cmpT)};
var cuenta=function(f){return activos(f).length};
function nombreDe(t){var c=cli(t.clienteId);return c?c.nombre:'(asistente eliminado)'}
function iniciales(n){var p=n.trim().split(/\s+/);return ((p[0]||'?').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toUpperCase()}
function hashC(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%5;return h}
function packInfo(c){
  if(!c||!c.pack)return null;
  var used=S.turnos.filter(function(t){return t.clienteId===c.id&&t.estado==='asistio'&&t.fecha>=(c.packDesde||'0000-00-00')}).length;
  return {total:c.pack,used:used,left:c.pack-used};
}
function proximo(c){
  var h=hoy(),n=nowMin();
  return S.turnos.filter(function(t){return t.clienteId===c.id&&t.estado!=='cancelado'&&(t.fecha>h||(t.fecha===h&&mins(t.hora)+t.min>n))}).sort(cmpT)[0];
}
function corto(f){
  var h=hoy();if(f===h)return 'hoy';if(f===addDays(h,1))return 'mañana';
  var d=parse(f);return DIAS3[d.getDay()]+' '+d.getDate()+' '+MESES3[d.getMonth()];
}
function durTxt(m){var h=Math.floor(m/60),r=m%60;return (h?h+' h':'')+(h&&r?' ':'')+(r?r+' min':'')||'0 min'}
function choques(f,h,min,excl){
  var a=mins(h),b=a+min;
  return S.turnos.filter(function(t){return t.id!==excl&&t.fecha===f&&t.estado!=='cancelado'&&mins(t.hora)<b&&mins(t.hora)+t.min>a});
}
function waNum(tel){
  var d=String(tel||'').replace(/\D/g,'');if(!d)return '';

function layout(list){
  var items=list.map(function(t){return {t:t,s:mins(t.hora),e:mins(t.hora)+t.min,col:0,cols:1}});
  var out=[],cluster=[],end=-1;
  function flush(){
    if(!cluster.length)return;
    var cols=[];
    cluster.forEach(function(it){
      var c=cols.findIndex(function(ce){return ce<=it.s});
      if(c<0){c=cols.length;cols.push(0)}
      cols[c]=it.e;it.col=c;
    });
    cluster.forEach(function(it){it.cols=cols.length});
    out=out.concat(cluster);cluster=[];end=-1;
  }
  items.forEach(function(it){
    if(cluster.length&&it.s>=end)flush();
    cluster.push(it);end=Math.max(end,it.e);
  });
  flush();return out;
}

function timeline(f){
  var L=activos(f),a=S.aj.ini,b=S.aj.fin;
  L.forEach(function(t){a=Math.min(a,Math.floor(mins(t.hora)/60));b=Math.max(b,Math.ceil((mins(t.hora)+t.min)/60))});
  b=Math.min(b,24);var HR=64,rows='';
  for(var h=a;h<b;h++)rows+='<button class="hr" style="top:'+((h-a)*HR)+'px" data-act="nuevo" data-f="'+f+'" data-h="'+pad(h)+':00" aria-label="Agendar a las '+pad(h)+':00"><span>'+pad(h)+':00</span></button>';
  var blocks=layout(L).map(function(it){
    var t=it.t,sv=serv(t.servicioId),top=(it.s-a*60)*HR/60,h=Math.max((it.e-it.s)*HR/60-3,40);
    var st=t.estado==='confirmado'?'':' · '+ESTADOS[t.estado];
    return '<button class="blk" data-act="turno" data-id="'+t.id+'" data-e="'+t.estado+'" style="top:'+top+'px;height:'+h+'px;left:calc(54px + (100% - 54px) * '+(it.col/it.cols)+');width:calc((100% - 54px) / '+it.cols+' - 4px);--bg2:var(--s'+sv.c+'-bg);--fg2:var(--s'+sv.c+'-fg)">'+
      '<span class="bt">'+t.hora+'–'+hhmm(it.e)+esc(st)+'</span><strong>'+esc(nombreDe(t))+'</strong>'+(h>=62?'<span class="bs">'+esc(sv.nombre)+' · '+esc(t.lugar)+'</span>':'')+'</button>';
  }).join('');
  var now='';
  if(f===hoy()&&nowMin()>=a*60&&nowMin()<=b*60)now='<div class="now" id="now" data-a="'+a+'" style="top:'+((nowMin()-a*60)*HR/60)+'px"></div>';
  return '<div class="tl" id="tl" style="height:'+((b-a)*HR)+'px">'+rows+blocks+now+'</div>';
}

var DOWS=[[1,'lunes'],[2,'martes'],[3,'miércoles'],[4,'jueves'],[5,'viernes'],[6,'sábado'],[0,'domingo']];
function restantesDe(pk,desde,id){
  if(!pk)return 8;
  var d=desde||hoy();
  var usados=id?S.turnos.filter(function(x){return x.clienteId===id&&x.estado!=='cancelado'&&x.fecha>=d}).length:0;
  return Math.max(pk-usados,1);
}

function pintarFilas(){
  var n=form.freq||0,box=$('#p-box');if(!box)return;
  box.hidden=!n;if(!n)return;
  var prev=[].slice.call(document.querySelectorAll('.p-hora')).map(function(i){return i.value});
  var hb=form.conFecha&&$('#f-hora')&&$('#f-hora').value;
  var def=hb||prev[0]||form.defHora||'09:00';
  var pats={1:[1],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5]};
  var days=pats[n].slice();
  if(form.conFecha&&$('#f-fecha')&&$('#f-fecha').value){
    var w=parse($('#f-fecha').value).getDay();
    days=days.filter(function(d){return d!==w});days.unshift(w);days=days.slice(0,n);
  }
  var h='';
  for(var i=0;i<n;i++){
    h+='<div class="prow"><select class="p-dia" aria-label="Día de la clase '+(i+1)+'">'+DOWS.map(function(d){return '<option value="'+d[0]+'"'+(d[0]===days[i]?' selected':'')+'>'+cap(d[1])+'</option>'}).join('')+'</select><input class="p-hora" type="time" aria-label="Horario de la clase '+(i+1)+'" value="'+esc(prev[i]||def)+'"></div>';
  }
  $('#p-rows').innerHTML=h;
}
function leerPlan(){
  var ds=[].slice.call(document.querySelectorAll('.p-dia')),hs=[].slice.call(document.querySelectorAll('.p-hora')),rows=[],seen={};
  for(var i=0;i<ds.length;i++){
    var h=hs[i].value;if(!h)return {err:'Completá el horario de cada clase.'};
    var d=parseInt(ds[i].value,10),k=d+'-'+h;
    if(seen[k])return {err:'Hay dos clases el mismo día y a la misma hora.'};
    seen[k]=1;rows.push({dow:d,hora:h});
  }
  var cant=parseInt($('#p-cant').value,10);
  if(!(cant>=1&&cant<=100))return {err:'Poné cuántas clases querés agendar (entre 1 y 100).'};
  return {rows:rows,cant:cant};
}
function generar(start,rows,cant){
  var out=[];
  for(var i=0;i<800&&out.length<cant;i++){
    var f=addDays(start,i),w=parse(f).getDay();
    rows.filter(function(r){return r.dow===w}).sort(function(a,b){return a.hora.localeCompare(b.hora)}).forEach(function(r){if(out.length<cant)out.push({fecha:f,hora:r.hora})});
  }
  return out;
}
function diasTxt(rows){return rows.slice().sort(function(a,b){return ((a.dow+6)%7)-((b.dow+6)%7)||a.hora.localeCompare(b.hora)}).map(function(r){return DIAS3[r.dow]+' '+r.hora}).join(', ')}

function fwarn(msg){var w=$('#f-warn');w.textContent=msg;w.hidden=false}
function sugerir(){
  var inp=$('#f-cli');if(!inp)return;
  var v=inp.value.trim(),q=norm(v),c=cli(form.clienteId);
  if(c&&norm(c.nombre)!==q){form.clienteId='';c=null}
  var exact=S.clientes.find(function(x){return norm(x.nombre)===q});
  var L=q?S.clientes.filter(function(x){return norm(x.nombre).indexOf(q)>=0&&!(exact&&x.id===exact.id&&form.clienteId===x.id)}).slice(0,5):S.clientes.slice(0,0);
  var h='';
  if(!form.clienteId)h=L.map(function(x){return '<button type="button" data-act="pick-cli" data-id="'+x.id+'">'+esc(x.nombre)+(x.tel?' <small>'+esc(x.tel)+'</small>':'')+'</button>'}).join('');
  if(!form.clienteId&&v&&!exact)h+='<button type="button" data-act="pick-nuevo"><small>Asistente nuevo:</small> '+esc(v)+'</button>';
  $('#sug').innerHTML=h;
  $('#f-newbox').hidden=!(v&&!exact&&!form.clienteId);
}

function guardarTurno(){
  var nombre=$('#f-cli').value.trim();
  if(!nombre){fwarn('Escribí o elegí un asistente.');return}
  var fecha=$('#f-fecha').value,hora=$('#f-hora').value;
  if(!fecha||!hora){fwarn('Completá la fecha y la hora.');return}
  var min=parseInt($('#f-min').value,10)||60;
  var c=cli(form.clienteId),nuevo=null;
  if(!c||norm(c.nombre)!==norm(nombre)){
    c=S.clientes.find(function(x){return norm(x.nombre)===norm(nombre)});
    if(!c){c=nuevo={id:uid(),nombre:nombre,tel:($('#f-tel')?$('#f-tel').value:'').trim(),pack:0,packDesde:hoy(),notas:'',alta:hoy()}}
  }
  var items=[{fecha:fecha,hora:hora}];
  if(!form.id&&form.freq>0){var pr=leerPlan();if(pr.err){fwarn(pr.err);return}items=generar(fecha,pr.rows,pr.cant)}
  var rep=items.length;
  var ch=[];items.forEach(function(it){choques(it.fecha,it.hora,min,form.id).forEach(function(x){ch.push({t:x,f:it.fecha})})});
  if(ch.length&&!form.ok){
    form.ok=true;
    var x=ch[0];
    fwarn('Se superpone con '+nombreDe(x.t)+' ('+corto(x.f)+' '+x.t.hora+')'+(ch.length>1?' y '+(ch.length-1)+' más':'')+'. Si igual querés guardarlo, tocá de nuevo.');
    $('#f-save').textContent='Guardar igual';return;
  }
  if(nuevo)S.clientes.push(nuevo);
  var notas=$('#f-notas').value.trim();
  if(form.id){
    var t=S.turnos.find(function(x){return x.id===form.id});
    Object.assign(t,{clienteId:c.id,servicioId:form.servicioId,fecha:fecha,hora:hora,min:min,lugar:form.lugar,estado:form.estado,notas:notas});
  }else{
    var serie=rep>1?uid():'';
    items.forEach(function(it){S.turnos.push({id:uid(),clienteId:c.id,servicioId:form.servicioId,fecha:it.fecha,hora:it.hora,min:min,lugar:form.lugar,estado:'confirmado',notas:notas,serie:serie})});
  }
  var wasId=form.id;
  var first=form.id?fecha:items[0].fecha;ui.fecha=first;ui.sel=first;var d=parse(first);ui.mes={y:d.getFullYear(),m:d.getMonth()};
  closeSheet();commit();
  toast(wasId?'Turno actualizado':(rep>1?rep+' turnos agendados':'Turno agendado'));
}

  var ant=mios.filter(function(t){return t.fecha<h}).sort(function(a,b){return -cmpT(a,b)}).slice(0,8);
  var n=function(e){return mios.filter(function(t){return t.estado===e}).length};
  function fila(t){return '<button class="row" data-act="turno" data-id="'+t.id+'"><span class="grow"><span class="nm">'+corto(t.fecha)+' · '+t.hora+'</span><span class="mt">'+esc(serv(t.servicioId).nombre)+'</span></span><span class="pill '+t.estado+'">'+ESTADOS[t.estado]+'</span></button>'}
  sheet('<div class="kv" style="margin-top:0"><span class="av" style="--bg2:var(--s'+k+'-bg);--fg2:var(--s'+k+'-fg)">'+esc(iniciales(c.nombre))+'</span><h2>'+esc(c.nombre)+'</h2></div>'+

    (c.frec&&c.dias?'<p class="meta">'+c.frec+(c.frec===1?' vez':' veces')+' por semana: '+esc(diasTxt(c.dias))+'</p>':'')+
    (c.notas?'<p style="margin-top:10px">'+esc(c.notas)+'</p>':'')+
    (p?'<div class="fl">Pack de clases</div><div class="pack'+(p.left<=0?' zero':p.left<=2?' low':'')+'" style="font-size:22px">'+p.used+' de '+p.total+' usadas · '+(p.left>0?'quedan '+p.left:'pack completo')+'</div><div class="bar"><i style="width:'+Math.min(100,p.used*100/p.total)+'%"></i></div>':'')+(pagoMes(id,hoy().slice(0,7))?'<div class="kv"><span class="pill confirmado">Abonó este mes</span><span class="meta">'+money(pagoMes(id,hoy().slice(0,7)).monto)+' · '+(pagoMes(id,hoy().slice(0,7)).metodo==='transferencia'?'Transferencia':'Efectivo')+'</span></div>':'<div class="kv"><span class="pill pendiente">Pago pendiente este mes</span></div>')+
    '<div class="stats"><div><b>'+n('asistio')+'</b><span>Asistió</span></div><div><b>'+n('ausente')+'</b><span>Ausente</span></div><div><b>'+n('cancelado')+'</b><span>Canceló</span></div></div>'+
    (prox.length?'<div class="h3">Próximos</div><div class="card">'+prox.map(fila).join('')+'</div>':'')+
    (ant.length?'<div class="h3">Historial</div><div class="card">'+ant.map(fila).join('')+'</div>':'')+
    '<div class="acts"><button class="btn pri" data-act="nuevo" data-c="'+id+'">Agendar turno</button><button class="btn" data-act="editar-cli" data-id="'+id+'">Editar</button></div>');
}

function abrirFormCli(id,conf){
  var c=id?cli(id):null;
  var mios=c?S.turnos.filter(function(t){return t.clienteId===id}).length:0;
  form={freq:0,ok:false,cid:id||'',defHora:'09:00',conFecha:false};
  sheet('<h2>'+(c?'Editar asistente':'Nuevo asistente')+'</h2>'+
    '<label class="fl" for="c-nom">Nombre y apellido</label><input id="c-nom" type="text" autocomplete="off" value="'+esc(c?c.nombre:'')+'">'+
    '<label class="fl" for="c-tel">Teléfono</label><input id="c-tel" type="tel" inputmode="tel" placeholder="Con código de área, sin 0 ni 15. Ej: 3521 456789" value="'+esc(c?c.tel:'')+'">'+
    '<div class="two"><div><label class="fl" for="c-pack">Pack de clases</label><input id="c-pack" type="number" inputmode="numeric" min="0" placeholder="0 = sin pack" value="'+(c&&c.pack?c.pack:'')+'"></div><div><label class="fl" for="c-desde">Pack desde</label><input id="c-desde" type="date" value="'+(c&&c.packDesde?c.packDesde:hoy())+'"></div></div>'+'<div class="h3">Cobro del mes</div><div class="two"><div><label class="fl" for="c-abonado">¿Abonó?</label><select id="c-abonado"><option value="no">No</option><option value="si">Sí</option></select></div><div><label class="fl" for="c-metodo">Forma de pago</label><select id="c-metodo"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option></select></div></div><div class="two"><div><label class="fl" for="c-monto">Monto cobrado</label><input id="c-monto" type="number" inputmode="decimal" min="0" step="1" value="0"></div><div><label class="fl" for="c-fechapago">Fecha de pago</label><input id="c-fechapago" type="date" value="'+hoy()+'"></div></div><p class="note">El monto se completa automáticamente según el pack, pero podés modificarlo si hacés un descuento o cobrás otro valor.</p>'+
    '<p class="note">Cada turno marcado como “Asistió” desde esa fecha descuenta una clase del pack.</p>'+
    (conf?'':planHTML(true,restantesDe(c?c.pack:0,c?c.packDesde:hoy(),id)))+
    '<label class="fl" for="c-notas">Notas</label><textarea id="c-notas" rows="3" placeholder="Objetivo, lesiones, horarios que le sirven…">'+esc(c?c.notas:'')+'</textarea>'+
    '<p id="c-warn" class="warn" hidden></p>'+
    '<div class="acts"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" id="c-save" data-act="guardar-cli" data-id="'+(id||'')+'">Guardar</button></div>'+
    (c?(conf?'<div class="warn" style="background:var(--surface2);color:var(--ink)">Se borra a '+esc(c.nombre)+(mios?' y sus '+mios+' turnos':'')+'. No se puede deshacer.<div class="acts"><button class="btn bad" data-act="cli-del-ok" data-id="'+id+'">Sí, eliminar</button><button class="btn" data-act="editar-cli" data-id="'+id+'">Cancelar</button></div></div>':'<div class="acts"><button class="btn bad" data-act="cli-del" data-id="'+id+'">Eliminar asistente</button></div>'):''));
  var pm=c?pagoMes(c.id,hoy().slice(0,7)):null;var ab=$('#c-abonado'),me=$('#c-metodo'),mo=$('#c-monto'),fp=$('#c-fechapago');if(ab)ab.value=pm?'si':'no';if(me)me.value=pm?pm.metodo:'transferencia';if(mo)mo.value=pm?pm.monto:precioPack(c&&c.pack?c.pack:0);if(fp)fp.value=pm?pm.fecha:hoy();
  var i=$('#c-nom');if(i&&!c)i.focus();
}
function guardarCli(id){
  var w=$('#c-warn');
  var wm=function(m){w.textContent=m;w.hidden=false};
  var nom=$('#c-nom').value.trim();
  if(!nom){wm('Escribí el nombre.');return}
  var dup=S.clientes.find(function(x){return norm(x.nombre)===norm(nom)&&x.id!==id});
  if(dup){wm('Ya existe un asistente con ese nombre.');return}
  var data={nombre:nom,tel:$('#c-tel').value.trim(),pack:parseInt($('#c-pack').value,10)||0,packDesde:$('#c-desde').value||hoy(),notas:$('#c-notas').value.trim()};
  var abonado=$('#c-abonado')&&$('#c-abonado').value==='si',metodo=$('#c-metodo')?$('#c-metodo').value:'transferencia',monto=parseFloat($('#c-monto')?$('#c-monto').value:0)||0,fechaPago=$('#c-fechapago')?$('#c-fechapago').value:hoy(),mesPago=fechaPago.slice(0,7);
  var cid=id||uid(),items=[],sv=null,lug='',pr=null;
  if(form.freq>0){
    pr=leerPlan();if(pr.err){wm(pr.err);return}
    sv=serv($('#p-serv').value);lug=$('#p-lug').value;
    var start=data.packDesde>hoy()?data.packDesde:hoy();
    items=generar(start,pr.rows,pr.cant);
    var ch=[];items.forEach(function(it){choques(it.fecha,it.hora,sv.min,null).forEach(function(x){ch.push({t:x,f:it.fecha})})});
    if(ch.length&&!form.ok){
      form.ok=true;var x0=ch[0];
      wm(ch.length+(ch.length===1?' clase se superpone':' clases se superponen')+' con otros turnos (por ejemplo '+corto(x0.f)+' '+x0.t.hora+' con '+nombreDe(x0.t)+'). Si igual querés agendarlas, tocá de nuevo.');
      $('#c-save').textContent='Guardar igual';return;
    }
  }
  if(pr){data.frec=pr.rows.length;data.dias=pr.rows}
  if(id){Object.assign(cli(id),data)}else{S.clientes.push(Object.assign({id:cid,alta:hoy()},data))}
  S.pagos=(S.pagos||[]).filter(function(p){return !(p.clienteId===cid&&p.mes===mesPago)});if(abonado&&monto>0)S.pagos.push({id:uid(),clienteId:cid,fecha:fechaPago,mes:mesPago,monto:monto,metodo:metodo,packClases:data.pack});
  if(items.length){
    var serie=uid();
    items.forEach(function(it){S.turnos.push({id:uid(),clienteId:cid,servicioId:sv.id,fecha:it.fecha,hora:it.hora,min:sv.min,lugar:lug,estado:'confirmado',notas:'',serie:serie})});
    ui.fecha=items[0].fecha;ui.sel=items[0].fecha;var d0=parse(items[0].fecha);ui.mes={y:d0.getFullYear(),m:d0.getMonth()};
  }
  closeSheet();commit();
  toast(items.length?items.length+' clases agendadas':'Asistente guardado');
}

function backup(){
  var js=JSON.stringify(S);
  sheet('<h2>Copia de seguridad</h2><p class="meta">Copiá este texto y guardalo en un lugar seguro (notas, mail). Para restaurar, pegalo en el segundo cuadro.</p>'+
    '<label class="fl" for="b-out">Tus datos</label><textarea id="b-out" rows="4" readonly>'+esc(js)+'</textarea>'+
    '<div class="acts"><button class="btn" data-act="copiar" data-t="__backup">Copiar</button></div>'+
    '<label class="fl" for="b-in">Restaurar desde una copia</label><textarea id="b-in" rows="3" placeholder="Pegá acá la copia"></textarea>'+
    '<p id="b-warn" class="warn" hidden></p>'+
    '<div class="acts"><button class="btn bad" data-act="restaurar">Restaurar y reemplazar todo</button><button class="btn" data-act="cerrar">Cerrar</button></div>');
}
function restaurar(){
  var w=$('#b-warn');
  try{
    var d=JSON.parse($('#b-in').value);
    if(!d||!Array.isArray(d.clientes)||!Array.isArray(d.turnos)||!Array.isArray(d.servicios))throw 0;
    S=Object.assign(base(),d);S.aj=Object.assign(base().aj,d.aj||{});
    closeSheet();commit();toast('Copia restaurada');
  }catch(e){w.textContent='Ese texto no parece una copia válida.';w.hidden=false}
}
function copiar(t){
  var done=function(){toast('Copiado')};
  var fb=function(){var o=$('#b-out');if(o){o.focus();o.select();toast('Seleccioné el texto, copialo manualmente')}else toast(t)};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),f=el.getAttribute('data-f');
  switch(a){
    case 'tab':ui.tab=el.getAttribute('data-v');ui.confCero=false;render();window.scrollTo(0,0);break;
    case 'dia':ui.fecha=f;render();break;
    case 'prev':ui.fecha=addDays(ui.fecha,-1);render();break;
    case 'next':ui.fecha=addDays(ui.fecha,1);render();break;
    case 'hoy':ui.fecha=hoy();render();break;
    case 'buscar':ui.buscar=!ui.buscar;if(!ui.buscar)ui.q='';render();if(ui.buscar){var q=$('#q');if(q)q.focus()}break;
    case 'mprev':ui.mes.m--;if(ui.mes.m<0){ui.mes.m=11;ui.mes.y--}render();break;
    case 'fprev':{var fp=ui.finMes.split('-'),fy=Number(fp[0]),fm=Number(fp[1])-2;if(fm<0){fm=11;fy--}ui.finMes=fy+'-'+pad(fm+1);render();break}
    case 'fnext':{var fn=ui.finMes.split('-'),ny=Number(fn[0]),nm=Number(fn[1]);if(nm>=12){nm=1;ny++}ui.finMes=ny+'-'+pad(nm);render();break}
    case 'mnext':ui.mes.m++;if(ui.mes.m>11){ui.mes.m=0;ui.mes.y++}render();break;
    case 'sel':ui.sel=f;render();break;
    case 'abrirdia':ui.fecha=ui.sel;ui.tab='agenda';render();window.scrollTo(0,0);break;
    case 'nuevo':{
      var pre={};
      if(f)pre.fecha=f;else if(ui.tab==='cal')pre.fecha=ui.sel;
      if(el.getAttribute('data-h'))pre.hora=el.getAttribute('data-h');
      if(el.getAttribute('data-c'))pre.clienteId=el.getAttribute('data-c');
      abrirForm(null,pre);break}
    case 'turno':abrirTurno(id);break;
    case 'estado':{var t=S.turnos.find(function(x){return x.id===id});if(t){t.estado=el.getAttribute('data-e');commit();abrirTurno(id);toast('Marcado como '+ESTADOS[t.estado].toLowerCase())}break}
    case 'editar-turno':abrirForm(S.turnos.find(function(x){return x.id===id}));break;
    case 'del':abrirTurno(id,true);break;
    case 'del-ok':S.turnos=S.turnos.filter(function(x){return x.id!==id});closeSheet();commit();toast('Turno eliminado');break;
    case 'del-serie':{var t2=S.turnos.find(function(x){return x.id===id});if(t2){S.turnos=S.turnos.filter(function(x){return !(x.id===id||(t2.serie&&x.serie===t2.serie&&x.fecha>t2.fecha))});closeSheet();commit();toast('Serie eliminada')}break}
    case 'pick':{
      var g=el.getAttribute('data-g'),v=el.getAttribute('data-v');form[g]=v;
      el.parentNode.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===el)});
      if(g==='servicioId'&&!form.id){var m=$('#f-min');var sv=serv(v);if(m){if(!m.querySelector('option[value="'+sv.min+'"]')){var o=document.createElement('option');o.value=sv.min;o.textContent=durTxt(sv.min);m.appendChild(o)}m.value=sv.min}}
      break}
    case 'pfreq':{
      form.freq=parseInt(el.getAttribute('data-v'),10);
      el.parentNode.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===el)});
      pintarFilas();
      var pc=$('#p-cant');if(pc&&form.cid!==undefined&&!form.conFecha&&!pc.dataset.dirty)pc.value=restantesDe(parseInt($('#c-pack').value,10)||0,$('#c-desde').value,form.cid);
      break}
    case 'pick-cli':{var c=cli(id);form.clienteId=id;$('#f-cli').value=c.nombre;sugerir();break}
    case 'pick-nuevo':form.clienteId='';$('#sug').innerHTML='';$('#f-newbox').hidden=false;var tl=$('#f-tel');if(tl)tl.focus();break;
    case 'guardar-turno':guardarTurno();break;
    case 'cerrar':closeSheet();break;
    case 'cliente':abrirCliente(id);break;
    case 'nuevo-cli':abrirFormCli(null);break;
    case 'editar-cli':abrirFormCli(id);break;
    case 'guardar-cli':guardarCli(id||null);break;
    case 'cli-del':abrirFormCli(id,true);break;
    case 'cli-del-ok':S.clientes=S.clientes.filter(function(x){return x.id!==id});S.turnos=S.turnos.filter(function(x){return x.clienteId!==id});closeSheet();commit();toast('Asistente eliminado');break;
    case 'copiar':{var t3=el.getAttribute('data-t');copiar(t3==='__backup'?JSON.stringify(S):t3);break}
    case 'backup':backup();break;
    case 'restaurar':restaurar();break;
    case 'cero':ui.confCero=true;render();break;
    case 'cero-no':ui.confCero=false;render();break;
    case 'cero-ok':S.clientes=[];S.turnos=[];S.pagos=[];S.demo=false;ui.confCero=false;commit();toast('Listo, tu agenda está vacía');break;
    case 'tema':S.aj.tema=el.getAttribute('data-v');commit();break;
    case 'svc-c':{var s=S.servicios.find(function(x){return x.id===id});if(s){s.c=parseInt(el.getAttribute('data-c'),10);commit()}break}
    case 'pack-add':S.packs.push({id:uid(),clases:8,precio:0});commit();break;
    case 'pack-del':{if(S.packs.length<=1){toast('Tiene que quedar al menos un pack')}else{S.packs=S.packs.filter(function(x){return x.id!==id});commit()}break}
    case 'svc-add':S.servicios.push({id:uid(),nombre:'Nuevo servicio',min:60,c:S.servicios.length%5});commit();break;
    case 'svc-del':{
      var usado=S.turnos.some(function(x){return x.servicioId===id});
      if(usado){toast('Hay turnos con este servicio, no se puede quitar')}
      else if(S.servicios.length<=1){toast('Tiene que quedar al menos un servicio')}
      else{S.servicios=S.servicios.filter(function(x){return x.id!==id});commit()}
      break}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;$('#res').innerHTML=resultados()}
  else if(t.id==='cq'){ui.cq=t.value;$('#clist').innerHTML=listaClientes()}
  else if(t.id==='f-cli'){sugerir()}
  else if(t.id==='c-pack'||t.id==='c-desde'){if(t.id==='c-pack'){var cm=$('#c-monto');if(cm)cm.value=precioPack(parseInt(t.value,10)||0)}var pc=$('#p-cant');if(pc&&!pc.dataset.dirty&&form.freq)pc.value=restantesDe(parseInt($('#c-pack').value,10)||0,$('#c-desde').value,form.cid)}
  else if(t.id==='p-cant'){t.dataset.dirty='1'}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-fecha'&&form.freq){pintarFilas();return}
  if(t.id==='aj-ini'||t.id==='aj-fin'){
    var ini=parseInt($('#aj-ini').value,10),fin=parseInt($('#aj-fin').value,10);
    if(fin<=ini){toast('El horario final tiene que ser posterior al inicial');render();return}
    S.aj.ini=ini;S.aj.fin=fin;persist();return;
  }
  var pr=t.closest&&t.closest('[data-pack-id]');if(pr){var pp=S.packs.find(function(x){return x.id===pr.getAttribute('data-pack-id')});if(pp){if(t.getAttribute('data-k')==='pack-clases'){var pc2=parseInt(t.value,10);if(pc2>=1){pp.clases=pc2;persist()}else t.value=pp.clases}if(t.getAttribute('data-k')==='pack-precio'){var px=parseFloat(t.value);if(px>=0){pp.precio=px;persist()}else t.value=pp.precio}}return}
  var r=t.closest&&t.closest('.srow');
  if(r){
    var s=S.servicios.find(function(x){return x.id===r.getAttribute('data-id')});if(!s)return;
    if(t.getAttribute('data-k')==='nombre'){var v=t.value.trim();if(v)s.nombre=v;else t.value=s.nombre}
    if(t.getAttribute('data-k')==='min'){var m=parseInt(t.value,10);if(m>=10&&m<=300)s.min=m;else t.value=s.min}
    persist();
  }
});
/* deslizar para cambiar de día */
var sx=0,sy=0,sTl=false;
document.addEventListener('touchstart',function(e){var tl=e.target.closest&&e.target.closest('#tl');sTl=!!tl;if(tl){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',function(e){
  if(!sTl)return;sTl=false;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dy)<40){ui.fecha=addDays(ui.fecha,dx<0?1:-1);render()}
},{passive:true});
/* línea de "ahora" */
setInterval(function(){
  var n=$('#now');if(!n)return;
  var a=parseInt(n.getAttribute('data-a'),10);n.style.top=((nowMin()-a*60)*64/60)+'px';
},60000);

start();
})();
</script>
