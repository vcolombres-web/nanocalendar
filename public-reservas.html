<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reservar turno · NanoCalendar</title><style>:root{--bg:#edf0f5;--card:#fff;--ink:#0f1726;--muted:#586377;--line:#d3dae5;--accent:#2346e6;--soft:#dae2ff;--ok:#1b7f4f;--bad:#c1243f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 16px 40px}h1{font-size:38px;line-height:1;margin:0}.sub{color:var(--muted);margin:8px 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.day{font-weight:800;font-size:20px;margin-bottom:12px;text-transform:capitalize}.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{min-height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:16px;cursor:pointer}.slot.selected{background:var(--accent);color:#fff;border-color:var(--accent)}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:14px 0 6px}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px;background:#fff}.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;margin-top:16px;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{padding:12px 14px;border-radius:12px;margin-top:14px;background:var(--soft)}.ok{background:#dff2e8;color:#145f3a}.err{background:#f9d9de;color:#97203a}.small{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}.hidden{display:none!important}@media(max-width:420px){.slots{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Reservar turno</h1><p class="sub">Elegí un sábado y uno de los horarios disponibles.</p><div id="days"><div class="card">Cargando horarios…</div></div><section class="card"><div id="selection">Seleccioná primero un horario.</div><label for="name">Nombre y apellido</label><input id="name" autocomplete="name" placeholder="Tu nombre y apellido"><label for="phone">Teléfono (opcional)</label><input id="phone" autocomplete="tel" inputmode="tel" placeholder="Para poder contactarte"><button class="btn" id="book" disabled>Confirmar reserva</button><div id="msg" class="msg hidden"></div></section><div class="small">No necesitás iniciar sesión. Pueden reservar varias personas en el mismo horario.</div></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>const firebaseConfig={apiKey:String.fromCharCode(65,73,122,97,83,121,65,54,117,90,78,121,115,48,84,70,72,100,117,113,57,48,74,83,101,82,66,57,99,79,122,74,106,66,107,112,75,84,115),authDomain:'nanocalendar17.firebaseapp.com',projectId:'nanocalendar17',storageBucket:'nanocalendar17.firebasestorage.app',messagingSenderId:'1054350803625',appId:'1:1054350803625:web:8b6a226d02c15620255fb8'};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const FALLBACK=['10:00','11:00'];let slots=FALLBACK.slice(),selected=null;const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function nextSaturdays(n){let d=new Date(),out=[];d.setHours(12,0,0,0);d.setDate(d.getDate()+((6-d.getDay()+7)%7));for(let i=0;i<n;i++){out.push(new Date(d));d.setDate(d.getDate()+7)}return out}function dateLabel(d){return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}function render(){const days=$('days');days.innerHTML=nextSaturdays(8).map(d=>`<section class="card"><div class="day">${dateLabel(d)}</div><div class="slots">${slots.map(t=>`<button class="slot" data-date="${ymd(d)}" data-time="${t}">${t}</button>`).join('')}</div></section>`).join('');document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{selected={date:b.dataset.date,time:b.dataset.time};document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('selection').textContent='Elegiste '+b.dataset.time+' · '+b.closest('.card').querySelector('.day').textContent;$('book').disabled=false})}async function syncAllToAgenda(){try{const q=await db.collection('publicReservations').get();if(q.empty)return;const ref=db.collection('sharedAgenda').doc('estado');const snap=await ref.get();let d=snap.exists&&snap.data().data?snap.data().data:null;if(!d)d={v:2,demo:false,servicios:[],clientes:[],turnos:[],pagos:[],packs:[],aj:{ini:7,fin:21,tema:'auto'}};d.servicios=Array.isArray(d.servicios)?d.servicios:[];d.clientes=Array.isArray(d.clientes)?d.clientes:[];d.turnos=Array.isArray(d.turnos)?d.turnos:[];d.pagos=Array.isArray(d.pagos)?d.pagos:[];d.packs=Array.isArray(d.packs)?d.packs:[];d.aj=Object.assign({ini:7,fin:21,tema:'auto'},d.aj||{});let sv=d.servicios.find(x=>x.id==='sv3');if(!sv){sv={id:'sv3',nombre:'Grupal',min:60,c:2};d.servicios.push(sv)}let added=0;q.docs.forEach(doc=>{const r=Object.assign({id:doc.id},doc.data());if(!r.date||!r.time||!r.name)return;if(d.turnos.some(t=>t.reservaPublicaId===r.id))return;const cid='pub-'+r.id;let c=d.clientes.find(x=>x.id===cid);if(!c){c={id:cid,nombre:r.name,tel:r.phone||'',pack:0,packDesde:r.date,notas:'Reserva realizada desde NanoCalendar público.',alta:r.date};d.clientes.push(c)}d.turnos.push({id:'pubturn-'+r.id,clienteId:cid,servicioId:sv.id,fecha:r.date,hora:r.time,min:sv.min||60,lugar:'Gimnasio',estado:'confirmado',notas:'Reserva pública',serie:'',reservaPublicaId:r.id});added++});if(added)await ref.set({data:d,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});return added}catch(e){console.error('sync agenda',e);return 0}}async function loadConfig(){try{await firebase.auth().signInAnonymously();const s=await db.collection('publicConfig').doc('reservas').get();if(s.exists&&Array.isArray(s.data().slots)&&s.data().slots.length)slots=s.data().slots.map(String)}catch(e){}render();await syncAllToAgenda()}$('book').onclick=async()=>{const name=$('name').value.trim(),phone=$('phone').value.trim();if(!selected||!name){$('msg').className='msg err';$('msg').textContent='Elegí un horario y completá tu nombre.';$('msg').classList.remove('hidden');return}const b=$('book');b.disabled=true;b.textContent='Guardando…';try{const user=firebase.auth().currentUser||await firebase.auth().signInAnonymously().then(x=>x.user);await db.collection('publicReservations').add({name,phone,date:selected.date,time:selected.time,status:'pendiente',createdAt:firebase.firestore.FieldValue.serverTimestamp(),anonymousUid:user.uid});await syncAllToAgenda();$('msg').className='msg ok';$('msg').textContent='¡Reserva confirmada! Te esperamos el '+selected.date.split('-').reverse().join('/')+' a las '+selected.time+'.';$('msg').classList.remove('hidden');$('name').value='';$('phone').value='';selected=null;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));$('selection').textContent='Reserva confirmada'}catch(e){console.error(e);$('msg').className='msg err';$('msg').textContent='No se pudo guardar la reserva. Probá nuevamente.';$('msg').classList.remove('hidden')}b.disabled=!selected;b.textContent='Confirmar reserva'};loadConfig();</script></body></html>
