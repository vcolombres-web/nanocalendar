<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instalar NanoCalendar</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#2346E6"><style>body{font:16px system-ui;margin:0;padding:40px 22px;background:#EDF0F5;color:#0F1726;text-align:center}main{max-width:420px;margin:auto;background:white;border-radius:20px;padding:28px}button{background:#2346E6;color:white;border:0;border-radius:12px;padding:14px 20px;font-weight:700;font-size:16px}p{color:#586377;line-height:1.5}</style></head><body><main><h1>NanoCalendar</h1><p>Preparando la aplicación para instalarla en este dispositivo…</p><button id="open">Abrir NanoCalendar</button></main><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(function(){document.getElementById('open').onclick=function(){location.href='./'};setTimeout(function(){location.reload()},800)}).catch(function(e){console.error(e)})}else{document.getElementById('open').onclick=function(){location.href='./'}};</script></body></html>
