<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de reservas · NanoReservas</title><style>:root{--bg:#edf0f5;--card:#fff;--ink:#0f1726;--muted:#586377;--line:#d3dae5;--accent:#2346e6;--ok:#1b7f4f;--bad:#c1243f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.back{color:var(--ink);text-decoration:none;font-weight:600}h1{font-size:38px;margin:0}.sub{color:var(--muted);margin:8px 0 24px}.card{background:var(--card);border-radius:18px;padding:20px;margin:14px 0}.hidden{display:none!important}.msg{padding:12px;border-radius:11px;margin-top:12px;background:#dae2ff}.ok{background:#dff2e8;color:#145f3a}.err{background:#f9d9de;color:#97203a}.btn{min-height:46px;padding:0 16px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#e2e7ef;color:var(--ink)}.datebar{display:flex;gap:10px;align-items:end}.datebar label{display:block;font-weight:700;flex:1}.datebar input{display:block;width:100%;margin-top:7px;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px}.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.metric{background:#f3f4f6;border-radius:14px;padding:17px}.metric b{display:block;font-size:28px}.metric span{color:var(--muted)}h2{margin:0 0 14px}.next-list{display:grid;gap:10px}.next-row{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:16px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}.next-row:hover{border-color:#9aa9d8}.next-date{font-weight:800;font-size:17px}.next-count{font-weight:800}.next-detail{color:var(--muted);font-size:14px}.badge{display:inline-block;background:#e8efff;color:#2447a7;border-radius:999px;padding:6px 10px;font-weight:800}.empty{color:var(--muted);padding:8px 0}.controls{display:flex;gap:10px;align-items:end;margin-bottom:18px}.controls label{flex:1;font-weight:700}.controls input{display:block;width:100%;margin-top:7px;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px}.slotgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.slotcard{background:#f3f4f6;border-radius:14px;padding:18px}.slotcard .time{font-size:20px;font-weight:800}.slotcard .big{font-size:30px;font-weight:800;margin-top:8px}.reservation{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.reservation:last-child{border-bottom:0}.time{font-size:20px;font-weight:800}.name{font-weight:700}.meta{font-size:13px;color:var(--muted)}.count{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:650px){.wrap{padding:20px 12px 40px}.top{align-items:flex-start}h1{font-size:31px}.datebar,.controls{flex-wrap:wrap}.datebar label,.controls label{min-width:100%}.summarygrid,.slotgrid{grid-template-columns:1fr}.next-row{grid-template-columns:1fr auto;gap:6px 12px}.next-detail{grid-column:1}.reservation{grid-template-columns:65px 1fr}.reservation .count{display:none}}</style></head><body><main class="wrap"><div class="top"><div><h1>Panel de reservas</h1><p class="sub">Administración del gimnasio</p></div><a class="back" href="/">← Volver a reservas</a></div><section id="login" class="card"><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo" autocomplete="username" style="width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px"><br><br><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:16px"><div class="actions"><button class="btn" id="loginBtn">Ingresar</button></div><div id="loginMsg" class="msg hidden"></div></section><section id="app" class="hidden"><section class="card"><h2>📅 Próximas reservas</h2><div id="nextList" class="next-list"><div class="empty">Cargando reservas…</div></div></section><section class="card"><div class="controls"><label>Consultar fecha<input id="date" type="date"></label><button class="btn" id="refresh">Actualizar</button><button class="btn alt" id="today">Hoy</button><button class="btn alt" id="logout">Salir</button></div><div id="selected"></div></section></section></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script>const cfg={apiKey:'AIzaSyA6uZNys0TFHduq90JSeRB9cOzJjBkpKTs',authDomain:'nanocalendar17.firebaseapp.com',projectId:'nanocalendar17',storageBucket:'nanocalendar17.firebasestorage.app',messagingSenderId:'1054350803625',appId:'1:1054350803625:web:8b6a226d02c15620255fb8'};firebase.initializeApp(cfg);const db=firebase.firestore(),auth=firebase.auth(),$=id=>document.getElementById(id);let slots=['09:00','10:30'],reservations=[];function msg(id,text,kind=''){const e=$(id);e.textContent=text;e.className='msg '+kind;e.classList.remove('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function active(){return reservations.filter(r=>String(r.status||'').toLowerCase()!=='cancelado')}function fmtDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}function nextSaturdays(){const out=[];let d=new Date();d.setHours(0,0,0,0);let diff=(6-d.getDay()+7)%7;if(diff===0&&new Date().getHours()>=23)diff=7;d.setDate(d.getDate()+diff);for(let i=0;i<8;i++){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');out.push(`${y}-${m}-${day}`);d.setDate(d.getDate()+7)}return out}function renderNext(){const a=active(),dates=nextSaturdays();const rows=dates.map(date=>{const rs=a.filter(r=>r.date===date);const by={};rs.forEach(r=>by[r.time]=(by[r.time]||0)+1);const detail=slots.map((s,i)=>`Turno ${i+1} ${s}: ${by[s]||0}`).join(' · ');return {date,total:rs.length,detail}});$('nextList').innerHTML=rows.map(x=>`<div class="next-row" data-date="${x.date}"><div class="next-date">${fmtDate(x.date)}</div><div class="next-detail">${x.total?esc(x.detail):'Sin reservas'}</div><div class="badge">${x.total} ${x.total===1?'reserva':'reservas'}</div></div>`).join('');document.querySelectorAll('.next-row').forEach(e=>e.onclick=()=>{$('date').value=e.dataset.date;renderSelected()})}function renderSelected(){const date=$('date').value;if(!date){$('selected').innerHTML='';return}const a=active().filter(r=>r.date===date);const counts={};a.forEach(r=>counts[r.time]=(counts[r.time]||0)+1);$('selected').innerHTML=`<h2>${fmtDate(date)}</h2><div class="slotgrid">${slots.map((s,i)=>`<div class="slotcard"><div>Turno ${i+1}</div><div class="time">${s}</div><div class="big">${counts[s]||0}<small> / 50</small></div><div>${counts[s]?'👥 Hay reservas':'Sin reservas'}</div></div>`).join('')}</div><div class="card" style="margin:14px 0 0;padding:16px;background:#f8f9fb"><h2 style="font-size:20px">👥 Quiénes reservaron</h2>${a.length?a.sort((x,y)=>(x.time||'').localeCompare(y.time||'')).map(r=>`<div class="reservation"><div class="time">${esc(r.time)}</div><div><div class="name">${esc(r.name)}</div><div class="meta">${r.phone?'📱 '+esc(r.phone):''}</div></div><div class="count">Confirmada</div></div>`).join(''):'<div class="empty">No hay reservas para este día.</div>'}</div>`}async function load(){try{const c=await db.collection('publicConfig').doc('reservas').get();if(c.exists&&Array.isArray(c.data().slots)&&c.data().slots.length)slots=c.data().slots.map(String)}catch(e){console.error(e)}try{const q=await db.collection('publicReservations').get();reservations=q.docs.map(d=>({id:d.id,...d.data()}));renderNext();renderSelected()}catch(e){console.error(e);$('nextList').innerHTML='<div class="empty">No se pudieron cargar las reservas.</div>'}}$('loginBtn').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=new Date().toISOString().slice(0,10);await load()}catch(e){msg('loginMsg','Correo o contraseña incorrectos.','err')}};$('refresh').onclick=load;$('today').onclick=()=>{$('date').value=new Date().toISOString().slice(0,10);renderSelected()};$('date').onchange=renderSelected;$('logout').onclick=()=>auth.signOut().then(()=>location.reload());</script></body></html>
