<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservas sábado · NanoCalendar</title>
<style>
:root{--bg:#edf0f5;--card:#fff;--ink:#0f1726;--muted:#586377;--line:#d3dae5;--accent:#2346e6;--soft:#dae2ff;--ok:#1b7f4f;--bad:#c1243f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:800px;margin:auto;padding:18px 14px 50px}h1{font-size:36px;line-height:1;margin:0}.sub{color:var(--muted);margin:7px 0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0}.toolbar{display:flex;gap:8px;align-items:center}.toolbar select{flex:1;min-width:0}select,input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}button{min-height:44px;border:0;border-radius:11px;padding:0 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.ghost{background:var(--soft);color:var(--ink)}.danger{background:#f9d9de;color:#97203a}.small{min-height:40px;padding:0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px;border-radius:14px;background:var(--soft)}.stat b{display:block;font-size:34px;line-height:1}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.totalStat{background:#fff;border:1px solid var(--line)}.totalStat b{font-size:28px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.turno h2{margin:0;font-size:20px}.count{font-size:13px;color:var(--muted);white-space:nowrap}.person{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}.person:first-child{border-top:0}.person small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);padding:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{padding:12px 14px;border-radius:12px;margin-top:12px;background:var(--soft)}.ok{background:#dff2e8;color:#145f3a}.err{background:#f9d9de;color:#97203a}.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:5}.login .card{width:min(390px,100%)}.hidden{display:none!important}.tiny{font-size:12px;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0}.tab{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line)}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.search{margin-top:10px}.summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{background:var(--soft);border-radius:999px;padding:7px 11px;font-weight:800}.navdays{display:flex;gap:7px;margin-top:8px}.navdays button{flex:1}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dff2e8;color:#145f3a}.badge.pending{background:#fff0c7;color:#765800}.listTitle{font-size:23px;margin:0}.allList .card{margin-top:9px}.nameLine{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.actions{display:flex;gap:6px}.notice{text-align:center;padding:10px;color:var(--muted);font-size:13px}
@media(max-width:520px){.grid,.row{grid-template-columns:1fr}.wrap{padding-top:15px}h1{font-size:30px}.person{align-items:flex-start}.person .actions button{font-size:12px;padding:0 9px}.toolbar button{font-size:13px;padding:0 10px}.tabs button{font-size:14px}}
</style>
</head>
<body>
<div id="login" class="login hidden"><section class="card"><h1 style="font-size:32px">NanoCalendar</h1><p class="sub">Ingresá para administrar las reservas.</p><label>Usuario</label><select id="who"><option value="mariano">Mariano</option><option value="usuario">Usuario</option></select><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:12px">Ingresar</button><div id="loginMsg" class="msg err hidden"></div></section></div>
<main class="wrap">
<div class="head"><div><h1>Reservas sábado</h1><p class="sub">Panel rápido de asistentes</p></div><button id="logout" class="ghost small">Salir</button></div>
<section class="card"><div class="toolbar"><button id="prev" class="ghost small">←</button><select id="date"></select><button id="next" class="ghost small">→</button><button id="refresh" class="ghost small">↻</button></div><div class="navdays"><button id="today" class="ghost small">Este sábado</button></div></section>
<div class="tabs"><button id="tabResumen" class="tab active">📊 Resumen</button><button id="tabPersonas" class="tab">👥 Quiénes reservaron</button></div>
<section id="viewResumen">
<div class="grid"><div class="stat"><b id="c1">0</b><span id="t1">Turno 1</span></div><div class="stat"><b id="c2">0</b><span id="t2">Turno 2</span></div></div>
<section class="card totalStat"><div class="head"><div><b style="font-size:14px">TOTAL DEL SÁBADO</b><div class="tiny">Personas con reserva activa</div></div><b id="totalGrande" style="font-size:32px">0</b></div></section>
<section class="card"><div class="head"><h2 style="margin:0">⚙️ Horarios</h2><span class="tiny">Podés cambiarlos cuando quieras</span></div><div class="row" style="margin-top:10px"><input id="slot1" placeholder="10:00"><input id="slot2" placeholder="11:00"></div><button id="saveConfig" style="margin-top:9px;width:100%">Guardar horarios</button><div id="configMsg" class="msg hidden"></div></section>
<div id="turnos"></div>
</section>
<section id="viewPersonas" class="hidden">
<section class="card"><div class="head"><div><h2 class="listTitle">👥 Quiénes reservaron</h2><div class="tiny" id="totalTexto">0 personas</div></div><button id="copyList" class="ghost small">📋 Copiar</button></div><input id="search" class="search" placeholder="🔎 Buscar por nombre o teléfono..."><div class="summary"><span class="pill" id="pill1">🕙 0</span><span class="pill" id="pill2">🕚 0</span><span class="pill" id="pillTotal">👥 0</span></div></section>
<div id="listaPersonas" class="allList"></div>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const cfg={apiKey:String.fromCharCode(65,73,122,97,83,121,65,54,117,90,78,121,115,48,84,70,72,100,117,113,57,48,74,83,101,82,66,57,99,79,122,74,106,66,107,112,75,84,115),authDomain:'nanocalendar17.firebaseapp.com',projectId:'nanocalendar17',storageBucket:'nanocalendar17.firebasestorage.app',messagingSenderId:'1054350803625',appId:'1:1054350803625:web:8b6a226d02c15620255fb8'};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();const emails={mariano:'mariano@nanocalendar.app',usuario:'usuario@nanocalendar.app'};let slots=['10:00','11:00'],reservas=[],satDates=[];
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function getSaturday(offset=0){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((6-d.getDay()+7)%7)+(offset*7));return d}function sats(n){let d=getSaturday();let a=[];for(let i=0;i<n;i++){a.push(new Date(d));d.setDate(d.getDate()+7)}return a}
function fillDates(){satDates=sats(20);const s=$('date'),old=s.value;s.innerHTML=satDates.map(d=>`<option value="${ymd(d)}">${d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</option>`).join('');if(old&&[...s.options].some(o=>o.value===old))s.value=old;}
function moveDate(n){let d=new Date($('date').value+'T12:00:00');d.setDate(d.getDate()+n*7);let target=ymd(d);if(![...$('date').options].some(o=>o.value===target)){const cur=satDates;const last=cur[cur.length-1];if(n>0&&d>last){satDates.push(d);$('date').insertAdjacentHTML('beforeend',`<option value="${target}">${d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</option>`)}else return}$('date').value=target;load()}
async function loadCfg(){try{let s=await db.collection('publicConfig').doc('reservas').get();if(s.exists&&Array.isArray(s.data().slots)&&s.data().slots.length>=2)slots=s.data().slots.map(String).slice(0,2)}catch(e){} $('slot1').value=slots[0];$('slot2').value=slots[1];$('t1').textContent='Turno 1 · '+slots[0];$('t2').textContent='Turno 2 · '+slots[1]}
async function load(){const date=$('date').value;try{const snap=await db.collection('publicReservations').where('date','==',date).get();reservas=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){$('turnos').innerHTML='<section class="card err">No se pudieron cargar las reservas.</section>';$('listaPersonas').innerHTML='<section class="card err">No se pudieron cargar las reservas.</section>'}}
function active(){return reservas.filter(r=>r.status!=='cancelado')}
function render(){let act=active(),a=act.filter(r=>r.time===slots[0]),b=act.filter(r=>r.time===slots[1]);$('c1').textContent=a.length;$('c2').textContent=b.length;$('totalGrande').textContent=act.length;$('pill1').textContent='🕙 '+slots[0]+': '+a.length;$('pill2').textContent='🕚 '+slots[1]+': '+b.length;$('pillTotal').textContent='👥 '+act.length;$('totalTexto').textContent=act.length+' persona'+(act.length===1?'':'s')+' con reserva activa';const block=(title,list)=>`<section class="card turno"><div class="head"><h2>${title}</h2><span class="count">${list.length} asistente${list.length===1?'':'s'}</span></div>${list.length?list.map(r=>person(r)).join(''):'<div class="empty">Todavía no hay reservas.</div>'}</section>`;$('turnos').innerHTML=block('🕙 Turno 1 · '+slots[0],a)+block('🕚 Turno 2 · '+slots[1],b);renderPeople()}
function person(r){let pending=r.status&&r.status!=='confirmado';return `<div class="person"><div><div class="nameLine"><b>${esc(r.name)}</b><span class="badge ${pending?'pending':''}">${r.status||'pendiente'}</span></div><small>${esc(r.phone||'Sin teléfono')}</small></div><div class="actions"><button class="danger small" onclick="cancelar('${r.id}')">Cancelar</button></div></div>`}
function renderPeople(){let q=$('search').value.trim().toLowerCase(),list=active().filter(r=>!q||String(r.name||'').toLowerCase().includes(q)||String(r.phone||'').toLowerCase().includes(q)).sort((x,y)=>String(x.time).localeCompare(String(y.time))||String(x.name).localeCompare(String(y.name)));if(!list.length){$('listaPersonas').innerHTML='<section class="card empty">No hay personas que coincidan con la búsqueda.</section>';return}$('listaPersonas').innerHTML=`<section class="card" style="padding-top:5px;padding-bottom:5px">${list.map((r,i)=>`<div class="person"><div><div class="nameLine"><b>${i+1}. ${esc(r.name)}</b><span class="badge">${esc(r.time||'')}</span></div><small>${esc(r.phone||'Sin teléfono')} · ${r.status||'pendiente'}</small></div><button class="danger small" onclick="cancelar('${r.id}')">Cancelar</button></div>`).join('')}</section>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.cancelar=async id=>{if(!confirm('¿Cancelar esta reserva?'))return;await db.collection('publicReservations').doc(id).update({status:'cancelado'});load()};
$('date').onchange=load;$('refresh').onclick=load;$('prev').onclick=()=>moveDate(-1);$('next').onclick=()=>moveDate(1);$('today').onclick=()=>{$('date').value=ymd(getSaturday());load()};$('search').oninput=renderPeople;
$('copyList').onclick=async()=>{let list=active().sort((a,b)=>String(a.time).localeCompare(String(b.time))||String(a.name).localeCompare(String(b.name)));let text='RESERVAS · '+$('date').selectedOptions[0].textContent+'\n\n'+list.map((r,i)=>`${i+1}. ${r.name} — ${r.time}${r.phone?' — '+r.phone:''}`).join('\n')+'\n\nTOTAL: '+list.length;try{await navigator.clipboard.writeText(text);$('copyList').textContent='✅ Copiado';setTimeout(()=>$('copyList').textContent='📋 Copiar',1400)}catch(e){alert(text)}};
$('saveConfig').onclick=async()=>{let a=$('slot1').value.trim(),b=$('slot2').value.trim();if(!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(a)||!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(b))return alert('Usá horarios como 10:00 y 11:00.');await db.collection('publicConfig').doc('reservas').set({slots:[a,b]});slots=[a,b];$('configMsg').className='msg ok';$('configMsg').textContent='Horarios guardados correctamente.';$('configMsg').classList.remove('hidden');render()};
function tab(personas){$('tabResumen').classList.toggle('active',!personas);$('tabPersonas').classList.toggle('active',personas);$('viewResumen').classList.toggle('hidden',personas);$('viewPersonas').classList.toggle('hidden',!personas)}$('tabResumen').onclick=()=>tab(false);$('tabPersonas').onclick=()=>tab(true);
$('loginBtn').onclick=()=>{let w=$('who').value,p=$('pass').value.trim();if(!p)return;$('loginBtn').disabled=true;auth.signInWithEmailAndPassword(emails[w],p).catch(()=>{$('loginBtn').disabled=false;$('loginMsg').textContent='Usuario o contraseña incorrectos.';$('loginMsg').classList.remove('hidden')})};$('pass').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{if(!u){$('login').classList.remove('hidden');return}$('login').classList.add('hidden');fillDates();await loadCfg();load()});
</script></body></html>
