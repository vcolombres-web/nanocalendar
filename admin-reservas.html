<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservas sábado · NanoCalendar</title>
<style>
:root{--bg:#edf0f5;--card:#fff;--ink:#0f1726;--muted:#586377;--line:#d3dae5;--accent:#2346e6;--soft:#dae2ff;--ok:#1b7f4f;--bad:#c1243f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}h1{font-size:38px;line-height:1;margin:0}.sub{color:var(--muted);margin:8px 0 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar select{flex:1;min-width:190px}select,input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink)}button{min-height:44px;border:0;border-radius:11px;padding:0 15px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.ghost{background:var(--soft);color:var(--ink)}.danger{background:#f9d9de;color:#97203a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px;border-radius:14px;background:var(--soft)}.stat b{display:block;font-size:34px;line-height:1}.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.turno h2{margin:0;font-size:22px}.count{font-size:14px;color:var(--muted)}.person{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.person:first-child{border-top:0}.person small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);padding:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{padding:12px 14px;border-radius:12px;margin-top:12px;background:var(--soft)}.ok{background:#dff2e8;color:#145f3a}.err{background:#f9d9de;color:#97203a}.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:5}.login .card{width:min(390px,100%)}.hidden{display:none!important}.tiny{font-size:12px;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.tab{width:100%;background:#fff;color:var(--ink);border:1px solid var(--line)}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.view.hidden{display:none}.allTitle{font-size:24px;margin:0}.total{font-size:15px;color:var(--muted);margin-top:4px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:var(--soft);border-radius:999px;padding:8px 12px;font-weight:800}
@media(max-width:520px){.grid,.row{grid-template-columns:1fr}.wrap{padding-top:18px}.person{align-items:flex-start}.tabs button{font-size:14px}}
</style>
</head>
<body>
<div id="login" class="login hidden"><section class="card"><h1 style="font-size:32px">NanoCalendar</h1><p class="sub">Ingresá para administrar las reservas.</p><label>Usuario</label><select id="who"><option value="mariano">Mariano</option><option value="usuario">Usuario</option></select><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:12px">Ingresar</button><div id="loginMsg" class="msg err hidden"></div></section></div>
<main class="wrap">
  <div class="head"><div><h1>Reservas sábado</h1><p class="sub">Panel de asistentes por turno</p></div><button id="logout" class="ghost">Salir</button></div>
  <section class="card"><div class="toolbar"><select id="date"></select><button id="refresh" class="ghost">Actualizar</button></div></section>
  <div class="tabs"><button id="tabResumen" class="tab active">📊 Resumen</button><button id="tabPersonas" class="tab">👥 Quiénes reservaron</button></div>

  <section id="viewResumen" class="view">
    <section class="grid"><div class="stat"><b id="c1">0</b><span id="t1">Turno 1</span></div><div class="stat"><b id="c2">0</b><span id="t2">Turno 2</span></div></section>
    <section class="card"><div class="head"><h2>Configuración</h2><span class="tiny">Los horarios se pueden cambiar</span></div><div class="row" style="margin-top:12px"><input id="slot1" placeholder="10:00"><input id="slot2" placeholder="11:00"></div><button id="saveConfig" style="margin-top:10px">Guardar horarios</button><div id="configMsg" class="msg hidden"></div></section>
    <div id="turnos"></div>
  </section>

  <section id="viewPersonas" class="view hidden">
    <section class="card"><h2 class="allTitle">👥 Quiénes reservaron</h2><div class="total" id="totalTexto">0 personas para este sábado</div><div class="summary"><span class="pill" id="pill1">🕙 0</span><span class="pill" id="pill2">🕚 0</span></div></section>
    <div id="listaPersonas"></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
const cfg={apiKey:String.fromCharCode(65,73,122,97,83,121,65,54,117,90,78,121,115,48,84,70,72,100,117,113,57,48,74,83,101,82,66,57,99,79,122,74,106,66,107,112,75,84,115),authDomain:'nanocalendar17.firebaseapp.com',projectId:'nanocalendar17',storageBucket:'nanocalendar17.firebasestorage.app',messagingSenderId:'1054350803625',appId:'1:1054350803625:web:8b6a226d02c15620255fb8'};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();const emails={mariano:'mariano@nanocalendar.app',usuario:'usuario@nanocalendar.app'};let slots=['10:00','11:00'],reservas=[];
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function sats(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((6-d.getDay()+7)%7));let a=[];for(let i=0;i<n;i++){a.push(new Date(d));d.setDate(d.getDate()+7)}return a}
function fillDates(){const s=$('date');s.innerHTML=sats(12).map(d=>`<option value="${ymd(d)}">${d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</option>`).join('');}
async function loadCfg(){try{let s=await db.collection('publicConfig').doc('reservas').get();if(s.exists&&Array.isArray(s.data().slots)&&s.data().slots.length>=2)slots=s.data().slots.map(String).slice(0,2)}catch(e){} $('slot1').value=slots[0];$('slot2').value=slots[1];$('t1').textContent='Turno 1 · '+slots[0];$('t2').textContent='Turno 2 · '+slots[1];}
async function load(){const date=$('date').value;try{const snap=await db.collection('publicReservations').where('date','==',date).get();reservas=snap.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){$('turnos').innerHTML='<section class="card err">No se pudieron cargar las reservas.</section>';$('listaPersonas').innerHTML='<section class="card err">No se pudieron cargar las reservas.</section>'}}
function render(){let a=reservas.filter(r=>r.status!=='cancelado'&&r.time===slots[0]),b=reservas.filter(r=>r.status!=='cancelado'&&r.time===slots[1]),act=[...a,...b];$('c1').textContent=a.length;$('c2').textContent=b.length;$('pill1').textContent='🕙 '+slots[0]+': '+a.length;$('pill2').textContent='🕚 '+slots[1]+': '+b.length;$('totalTexto').textContent=act.length+' persona'+(act.length===1?'':'s')+' para este sábado';
const block=(title,list)=>`<section class="card turno"><div class="head"><h2>${title}</h2><span class="count">${list.length} asistente${list.length===1?'':'s'}</span></div>${list.length?list.map(r=>person(r)).join(''):'<div class="empty">Todavía no hay reservas.</div>'}</section>`;
$('turnos').innerHTML=block('Turno 1 · '+slots[0],a)+block('Turno 2 · '+slots[1],b);
$('listaPersonas').innerHTML=block('🕙 '+slots[0],a)+block('🕚 '+slots[1],b)}
function person(r){return `<div class="person"><div><b>${esc(r.name)}</b><small>${esc(r.phone||'Sin teléfono')} · ${r.status||'pendiente'}</small></div><button class="danger" onclick="cancelar('${r.id}')">Cancelar</button></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.cancelar=async id=>{if(!confirm('¿Cancelar esta reserva?'))return;await db.collection('publicReservations').doc(id).update({status:'cancelado'});load()};
$('date').onchange=load;$('refresh').onclick=load;$('saveConfig').onclick=async()=>{let a=$('slot1').value.trim(),b=$('slot2').value.trim();if(!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(a)||!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(b)){return alert('Usá horarios como 10:00 y 11:00.')}await db.collection('publicConfig').doc('reservas').set({slots:[a,b]});slots=[a,b];$('configMsg').className='msg ok';$('configMsg').textContent='Horarios guardados.';$('configMsg').classList.remove('hidden');render();};
function activarTab(personas){$('tabResumen').classList.toggle('active',!personas);$('tabPersonas').classList.toggle('active',personas);$('viewResumen').classList.toggle('hidden',personas);$('viewPersonas').classList.toggle('hidden',!personas)}
$('tabResumen').onclick=()=>activarTab(false);$('tabPersonas').onclick=()=>activarTab(true);
$('loginBtn').onclick=()=>{let w=$('who').value,p=$('pass').value.trim();if(!p)return;$('loginBtn').disabled=true;auth.signInWithEmailAndPassword(emails[w],p).catch(()=>{ $('loginBtn').disabled=false;$('loginMsg').textContent='Usuario o contraseña incorrectos.';$('loginMsg').classList.remove('hidden')})};$('pass').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{if(!u){$('login').classList.remove('hidden');return}$('login').classList.add('hidden');fillDates();await loadCfg();load()});
</script></body></html>
